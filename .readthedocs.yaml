# Read the Docs build configuration.
# Builds the MkDocs site on every push / PR / tag; serves versioned docs
# (latest / stable / per-release) at https://plinta.readthedocs.io/.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
    # Install the package so mkdocstrings can import plinta for the Python API ref.
    - method: pip
      path: .
