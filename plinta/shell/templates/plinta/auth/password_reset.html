{% extends "plinta/shell/auth_base.html" %}
{% block auth_title %}Reset your password{% endblock %}
{% block auth_body %}
    <form method="post">{% csrf_token %}{% for field in form %}<div class="pl-field"><label class="pl-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="pl-error">{{ error }}</div>{% endfor %}</div>{% endfor %}<button type="submit" class="pl-btn pl-btn--primary" style="width: 100%">Send the link</button></form>
{% endblock %}
