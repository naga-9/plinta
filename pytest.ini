[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
# Repo root on sys.path so `tests.*` imports.
pythonpath = .
# The per-layer tests inside the package and the standalone suite under tests/.
testpaths = plinta tests
python_files = test_*.py
# Contrib is skipped here and run by pytest-contrib.ini instead. Its tests need
# their own apps installed, and a core suite with a contrib app installed can
# come to depend on one being present — which is the coupling the layering
# exists to prevent.
addopts = -p no:cacheprovider --ignore=plinta/contrib
